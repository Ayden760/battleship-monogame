name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Accept Microsoft Fonts EULA
        run: |
         echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections

      - name: Install Arial fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ttf-mscorefonts-installer
          
      - name: Diagnose paths
        run: |
          pwd
          ls -la
          ls -la BattleShip.Tests

      - run: dotnet restore BattleShip.Tests/BattleShip.Tests.csproj
      - run: dotnet test BattleShip.Tests/BattleShip.Tests.csproj --configuration Release --verbosity minimal